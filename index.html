<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>2D Çiftlik Dünyası</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #1f3616;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }

    .stage {
      position: relative;
      width: 100vw;
      max-width: 960px;
      aspect-ratio: 840 / 600;
      max-height: 100vh;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
      border-radius: 14px;
      overflow: hidden;
      background: #6ab845;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    /* Üst HUD */
    .hud {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .hud-card {
      background: rgba(66, 39, 17, 0.88);
      border: 2px solid #e0b363;
      border-radius: 999px;
      padding: 5px 12px;
      color: #fff8e7;
      font-weight: 800;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .hud-card.clickable {
      cursor: pointer;
      transition: transform 0.1s;
    }
    .hud-card.clickable:active {
      transform: scale(0.95);
    }

    .lvl-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffd43b, #f08c00);
      color: #4f2900;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      border: 2px solid #fff3bf;
      margin-left: -6px;
    }

    .xp-track {
      width: 70px;
      height: 8px;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid #a67c46;
    }

    .xp-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4dabf7, #74c0fc);
      transition: width 0.25s;
    }

    /* Alt Tohum Seçici */
    .dock {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(66, 39, 17, 0.88);
      border: 2px solid #e0b363;
      border-radius: 16px;
      padding: 6px 10px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      z-index: 10;
    }

    .seed-btn {
      background: #fff5db;
      border: 2px solid #b58342;
      border-radius: 11px;
      padding: 5px 11px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: #4a2c11;
      font-weight: 800;
      font-size: 0.82rem;
      transition: transform 0.12s, background 0.15s;
    }

    .seed-btn.active {
      background: #d8f5a2;
      border-color: #2f9e44;
      transform: translateY(-3px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.25);
    }

    .seed-btn small {
      color: #9c6211;
      font-size: 0.74rem;
    }

    /* Bildirim */
    .toast {
      position: absolute;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(38, 22, 9, 0.92);
      color: #ffe8a3;
      border: 2px solid #e0b363;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 20;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    /* Modal */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 30;
    }
    .modal-backdrop.open { display: flex; }

    .modal-box {
      width: 100%;
      max-width: 390px;
      background: #fff8e7;
      border: 4px solid #7d4e24;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      background: linear-gradient(180deg, #8c5a2b, #6b411c);
      color: #fff8e7;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      font-size: 1rem;
    }

    .close-btn {
      background: #e03131;
      color: #fff;
      border: 2px solid #fff;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-weight: 900;
      cursor: pointer;
    }

    .modal-body {
      padding: 12px;
      max-height: 60vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item-row {
      background: #f7ebd2;
      border: 2px solid #dec495;
      border-radius: 12px;
      padding: 9px 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .item-info h4 { font-size: 0.9rem; color: #4a2c11; }
    .item-info p { font-size: 0.74rem; color: #785532; margin-top: 2px; }

    .act-btn {
      background: linear-gradient(180deg, #51cf66, #2f9e44);
      color: #fff;
      border: 2px solid #2b8a3e;
      border-radius: 9px;
      padding: 7px 11px;
      font-weight: 800;
      font-size: 0.78rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .act-btn:disabled {
      background: #adb5bd;
      border-color: #868e96;
      cursor: not-allowed;
    }
    .act-btn.sell {
      background: linear-gradient(180deg, #fcc419, #f08c00);
      border-color: #d9480f;
      color: #4a2200;
    }

    @media (max-width: 600px) {
      .hud-card { padding: 4px 9px; font-size: 0.76rem; }
      .seed-btn { padding: 4px 8px; font-size: 0.74rem; }
      .xp-track { width: 48px; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="gameCanvas"></canvas>

    <!-- Üst HUD -->
    <div class="hud">
      <div class="hud-group">
        <div class="hud-card">
          <div class="lvl-badge" id="lvlEl">1</div>
          <div class="xp-track"><div class="xp-fill" id="xpFill"></div></div>
