<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>2D Çiftlik Dünyası</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #1f3616;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }

    .stage {
      position: relative;
      width: 100vw;
      max-width: 960px;
      aspect-ratio: 840 / 600;
      max-height: 100vh;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
      border-radius: 14px;
      overflow: hidden;
      background: #6ab845;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    /* Üst HUD */
    .hud {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .hud-card {
      background: rgba(66, 39, 17, 0.88);
      border: 2px solid #e0b363;
      border-radius: 999px;
      padding: 5px 12px;
      color: #fff8e7;
      font-weight: 800;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .hud-card.clickable {
      cursor: pointer;
      transition: transform 0.1s;
    }
    .hud-card.clickable:active {
      transform: scale(0.95);
    }

    .lvl-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffd43b, #f08c00);
      color: #4f2900;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      border: 2px solid #fff3bf;
      margin-left: -6px;
    }

    .xp-track {
      width: 70px;
      height: 8px;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid #a67c46;
    }

    .xp-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4dabf7, #74c0fc);
      transition: width 0.25s;
    }

    /* Alt Tohum Seçici */
    .dock {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(66, 39, 17, 0.88);
      border: 2px solid #e0b363;
      border-radius: 16px;
      padding: 6px 10px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      z-index: 10;
    }

    .seed-btn {
      background: #fff5db;
      border: 2px solid #b58342;
      border-radius: 11px;
      padding: 5px 11px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: #4a2c11;
      font-weight: 800;
      font-size: 0.82rem;
      transition: transform 0.12s, background 0.15s;
    }

    .seed-btn.active {
      background: #d8f5a2;
      border-color: #2f9e44;
      transform: translateY(-3px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.25);
    }

    .seed-btn small {
      color: #9c6211;
      font-size: 0.74rem;
    }

    /* Bildirim */
    .toast {
      position: absolute;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(38, 22, 9, 0.92);
      color: #ffe8a3;
      border: 2px solid #e0b363;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 20;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    /* Modal */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 30;
    }
    .modal-backdrop.open { display: flex; }

    .modal-box {
      width: 100%;
      max-width: 390px;
      background: #fff8e7;
      border: 4px solid #7d4e24;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      background: linear-gradient(180deg, #8c5a2b, #6b411c);
      color: #fff8e7;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      font-size: 1rem;
    }

    .close-btn {
      background: #e03131;
      color: #fff;
      border: 2px solid #fff;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-weight: 900;
      cursor: pointer;
    }

    .modal-body {
      padding: 12px;
      max-height: 60vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item-row {
      background: #f7ebd2;
      border: 2px solid #dec495;
      border-radius: 12px;
      padding: 9px 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .item-info h4 { font-size: 0.9rem; color: #4a2c11; }
    .item-info p { font-size: 0.74rem; color: #785532; margin-top: 2px; }

    .act-btn {
      background: linear-gradient(180deg, #51cf66, #2f9e44);
      color: #fff;
      border: 2px solid #2b8a3e;
      border-radius: 9px;
      padding: 7px 11px;
      font-weight: 800;
      font-size: 0.78rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .act-btn:disabled {
      background: #adb5bd;
      border-color: #868e96;
      cursor: not-allowed;
    }
    .act-btn.sell {
      background: linear-gradient(180deg, #fcc419, #f08c00);
      border-color: #d9480f;
      color: #4a2200;
    }

    @media (max-width: 600px) {
      .hud-card { padding: 4px 9px; font-size: 0.76rem; }
      .seed-btn { padding: 4px 8px; font-size: 0.74rem; }
      .xp-track { width: 48px; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="gameCanvas"></canvas>

    <!-- Üst HUD -->
    <div class="hud">
      <div class="hud-group">
        <div class="hud-card">
          <div class="lvl-badge" id="lvlEl">1</div>
          <div class="xp-track"><div class="xp-fill" id="xpFill"></div></div>
        </div>
      </div>
      <div class="hud-group">
        <div class="hud-card">🪙 <span id="goldEl">45</span></div>
        <div class="hud-card clickable" id="barnHudBtn" title="Ambarı Aç">🏠 <span id="barnCountEl">0</span></div>
      </div>
    </div>

    <div class="toast" id="toastEl"></div>

    <!-- Alt Tohum Çubuğu -->
    <div class="dock" id="seedDock"></div>

    <!-- Modal -->
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal-box">
        <div class="modal-header">
          <span id="modalTitle">Panel</span>
          <button class="close-btn" id="closeModalBtn">✕</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const W = 840;
    const H = 600;

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    /* OYUN VERİLERİ */
    const ITEMS = {
      wheat:      { name: "Buğday",        emoji: "🌾", sell: 4,  seedCost: 2, growTime: 6  },
      corn:       { name: "Mısır",         emoji: "🌽", sell: 8,  seedCost: 4, growTime: 10 },
      strawberry: { name: "Çilek",         emoji: "🍓", sell: 15, seedCost: 8, growTime: 16 },
      egg:        { name: "Yumurta",       emoji: "🥚", sell: 12 },
      milk:       { name: "Süt",           emoji: "🥛", sell: 18 },
      bread:      { name: "Ekmek",         emoji: "🍞", sell: 24 },
      cornbread:  { name: "Mısır Ekmeği",  emoji: "🥐", sell: 38 },
      cake:       { name: "Çilekli Pasta", emoji: "🍰", sell: 78 }
    };

    const RECIPES = [
      { id: "bread",     time: 8,  xp: 6,  ingredients: { wheat: 2 } },
      { id: "cornbread", time: 12, xp: 10, ingredients: { corn: 2, egg: 1 } },
      { id: "cake",      time: 18, xp: 20, ingredients: { wheat: 1, strawberry: 2, egg: 1, milk: 1 } }
    ];

    const STORAGE_KEY = "farm2DWorld_v1";

    let state = {
      gold: 45,
      level: 1,
      xp: 0,
      selectedSeed: "wheat",
      inventory: { wheat: 2, corn: 0, strawberry: 0, egg: 0, milk: 0, bread: 0, cornbread: 0, cake: 0 },
      fields: Array.from({ length: 9 }, () => ({ crop: null, readyAt: 0, plantedAt: 0 })),
      animals: {
        chicken: { state: "hungry", readyAt: 0 },
        cow:     { state: "hungry", readyAt: 0 }
      },
      bakery: { bakingId: null, readyAt: 0 },
      orders: []
    };

    /* DÜNYA BÖLGELERİ */
    const ZONES = {
      barn:       { x: 60,  y: 78,  w: 170, h: 130 },
      bakery:     { x: 270, y: 78,  w: 150, h: 130 },
      truck:      { x: 540, y: 85,  w: 220, h: 115 },
      chickenPen: { x: 55,  y: 255, w: 230, h: 125 },
      cowPen:     { x: 55,  y: 410, w: 230, h: 125 }
    };

    // İzometrik 3x3 Tarla Koordinatları
    const TILE_W = 112;
    const TILE_H = 58;
    const FIELD_ORIGIN_X = 560;
    const FIELD_ORIGIN_Y = 278;

    const fieldCenters = [];
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        fieldCenters.push({
          cx: FIELD_ORIGIN_X + (c - r) * (TILE_W / 2),
          cy: FIELD_ORIGIN_Y + (c + r) * (TILE_H / 2)
        });
      }
    }

    /* ANİMASYON NESNELERİ */
    const chickens = [
      { x: 110, y: 315, tx: 150, ty: 325, dir: 1, wait: 0 },
      { x: 190, y: 335, tx: 130, ty: 345, dir: -1, wait: 1.2 },
      { x: 230, y: 300, tx: 210, ty: 350, dir: -1, wait: 0.6 }
    ];

    const cows = [
      { x: 125, y: 470, tx: 205, ty: 485, dir: 1, wait: 0.5 },
      { x: 220, y: 495, tx: 140, ty: 465, dir: -1, wait: 1.8 }
    ];

    const clouds = [
      { x: 80,  y: 28, speed: 12, scale: 1 },
      { x: 380, y: 18, speed: 8,  scale: 0.8 },
      { x: 660, y: 32, speed: 15, scale: 1.1 }
    ];

    const smokeParticles = [];
    const floatingTexts = [];
    let truckAnim = { active: false, x: 620, phase: "idle" };
    let hoverTarget = null;
    let currentModal = null;
    let toastTimer = null;

    /* KAYIT & YARDIMCILAR */
    function saveGame() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadGame() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      try {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.inventory && Array.isArray(parsed.fields) && parsed.fields.length === 9) {
          state = parsed;
        }
      } catch (e) {}
    }

    function showToast(msg) {
      const el = document.getElementById("toastEl");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2300);
    }

    function addFloatingText(x, y, text, color = "#ffe066") {
      floatingTexts.push({ x, y, text, color, life: 1.2, maxLife: 1.2 });
    }

    function xpNeeded() { return state.level * 30; }

    function addXp(amount, fx, fy) {
      state.xp += amount;
      while (state.xp >= xpNeeded()) {
        state.xp -= xpNeeded();
        state.level += 1;
        state.gold += 25;
        showToast(`🎉 Seviye ${state.level} oldun! +25🪙 bonus!`);
        addFloatingText(W / 2, 180, `⭐ SEVİYE ${state.level}!`, "#74c0fc");
      }
      updateHud();
    }

    function generateOrder() {
      const pool = ["wheat", "corn", "egg", "bread"];
      if (state.level >= 2) pool.push("milk", "strawberry", "cornbread");
      if (state.level >= 3) pool.push("cake");

      const item1 = pool[Math.floor(Math.random() * pool.length)];
      const qty1 = item1 === "cake" ? 1 : Math.floor(Math.random() * 2) + 1;
      const req = { [item1]: qty1 };

      if (Math.random() > 0.45) {
        const item2 = pool[Math.floor(Math.random() * pool.length)];
        if (item2 !== item1) req[item2] = 1;
      }

      let base = 0;
      for (const [k, v] of Object.entries(req)) base += ITEMS[k].sell * v;

      return {
        id: Math.random().toString(36).slice(2, 8),
        req,
        gold: Math.round(base * 1.45),
        xp: Math.max(8, Math.round(base * 0.4))
      };
    }

    function ensureOrders() {
      while (state.orders.length < 3) state.orders.push(generateOrder());
    }

    function canFulfill(req) {
      return Object.entries(req).every(([k, v]) => (state.inventory[k] || 0) >= v);
    }

    /* HUD VE TOHUM ÇUBUĞU */
    function updateHud() {
      document.getElementById("lvlEl").textContent = state.level;
      document.getElementById("xpFill").style.width = `${Math.min(100, (state.xp / xpNeeded()) * 100)}%`;
      document.getElementById("goldEl").textContent = state.gold;
      const total = Object.values(state.inventory).reduce((a, b) => a + b, 0);
      document.getElementById("barnCountEl").textContent = total;
    }

    function renderSeedDock() {
      const dock = document.getElementById("seedDock");
      dock.innerHTML = "";
      ["wheat", "corn", "strawberry"].forEach(id => {
        const item = ITEMS[id];
        const btn = document.createElement("button");
        btn.className = "seed-btn" + (state.selectedSeed === id ? " active" : "");
        btn.innerHTML = `<span>${item.emoji}</span> <span>${item.name}</span> <small>${item.seedCost}🪙</small>`;
        btn.onclick = () => {
          state.selectedSeed = id;
          renderSeedDock();
          saveGame();
        };
        dock.appendChild(btn);
      });
    }

    /* MODAL YÖNETİMİ */
    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalTitle = document.getElementById("modalTitle");
    const modalBody = document.getElementById("modalBody");

    function openModal(type) {
      currentModal = type;
      modalBackdrop.classList.add("open");
      renderModal();
    }

    function closeModal() {
      currentModal = null;
      modalBackdrop.classList.remove("open");
    }

    function renderModal() {
      if (!currentModal) return;
      modalBody.innerHTML = "";
      const now = Date.now();

      if (currentModal === "truck") {
        modalTitle.textContent = "🚚 Kamyon Siparişleri";
        state.orders.forEach((order, idx) => {
          const reqText = Object.entries(order.req).map(([k, v]) => `${v}x ${ITEMS[k].emoji} ${ITEMS[k].name}`).join(" + ");
          const ok = canFulfill(order.req) && !truckAnim.active;

          const row = document.createElement("div");
          row.className = "item-row";
          row.innerHTML = `
            <div class="item-info">
              <h4>${reqText}</h4>
              <p>Ödül: <b>${order.gold}🪙</b> • <b>+${order.xp} XP</b></p>
            </div>
            <button class="act-btn" ${ok ? "" : "disabled"}>Gönder</button>
          `;
          row.querySelector("button").onclick = () => {
            if (!canFulfill(order.req) || truckAnim.active) return;
            for (const [k, v] of Object.entries(order.req)) state.inventory[k] -= v;
            state.gold += order.gold;
            addXp(order.xp);
            state.orders.splice(idx, 1);
            ensureOrders();
            saveGame();
            updateHud();
            closeModal();
            truckAnim = { active: true, x: 620, phase: "leaving" };
            addFloatingText(650, 120, `+${order.gold}🪙`, "#ffe066");
            showToast(`🚚 Kamyon yola çıktı! +${order.gold}🪙`);
          };
          modalBody.appendChild(row);
        });
      }

      if (currentModal === "bakery") {
        modalTitle.textContent = "🥖 Taş Fırın";
        if (state.bakery.bakingId) {
          const item = ITEMS[state.bakery.bakingId];
          const done = now >= state.bakery.readyAt;
          const left = Math.max(0, Math.ceil((state.bakery.readyAt - now) / 1000));
          const row = document.createElement("div");
          row.className = "item-row";
          row.style.background = done ? "#d8f5a2" : "#fff3bf";
          row.innerHTML = `
            <div class="item-info">
              <h4>${item.emoji} ${item.name} ${done ? "Hazır!" : "Pişiyor..."}</h4>
              <p>${done ? "Ambara almak için tıkla" : `${left} sn kaldı`}</p>
            </div>
            <button class="act-btn" ${done ? "" : "disabled"}>Al</button>
          `;
          row.querySelector("button").onclick = () => {
            const r = RECIPES.find(x => x.id === state.bakery.bakingId);
            state.inventory[state.bakery.bakingId] = (state.inventory[state.bakery.bakingId] || 0) + 1;
            addXp(r ? r.xp : 8);
            addFloatingText(345, 110, `+1 ${item.emoji}`, "#fff");
            state.bakery.bakingId = null;
            state.bakery.readyAt = 0;
            saveGame();
            updateHud();
            renderModal();
          };
          modalBody.appendChild(row);
        }

        RECIPES.forEach(r => {
          const item = ITEMS[r.id];
          const ingText = Object.entries(r.ingredients).map(([k, v]) => `${v}x ${ITEMS[k].emoji}`).join(" + ");
          const canBake = !state.bakery.bakingId && canFulfill(r.ingredients);
          const row = document.createElement("div");
          row.className = "item-row";
          row.innerHTML = `
            <div class="item-info">
              <h4>${item.emoji} ${item.name} (${r.time} sn)</h4>
              <p>Gereken: ${ingText}</p>
            </div>
            <button class="act-btn" ${canBake ? "" : "disabled"}>Pişir</button>
          `;
          row.querySelector("button").onclick = () => {
            if (!canBake) return;
            for (const [k, v] of Object.entries(r.ingredients)) state.inventory[k] -= v;
            state.bakery.bakingId = r.id;
            state.bakery.readyAt = Date.now() + r.time * 1000;
            saveGame();
            updateHud();
            showToast(`🔥 ${item.name} fırına verildi!`);
            closeModal();
          };
          modalBody.appendChild(row);
        });
      }

      if (currentModal === "barn") {
        modalTitle.textContent = "🏠 Ambar (Stok & Pazar)";
        Object.entries(ITEMS).forEach(([id, item]) => {
          const count = state.inventory[id] || 0;
          const row = document.createElement("div");
          row.className = "item-row";
          row.innerHTML = `
            <div class="item-info">
              <h4>${item.emoji} ${item.name}: <b>${count} adet</b></h4>
              <p>Satış fiyatı: ${item.sell}🪙</p>
            </div>
            <button class="act-btn sell" ${count > 0 ? "" : "disabled"}>1 Sat (+${item.sell}🪙)</button>
          `;
          row.querySelector("button").onclick = () => {
            if (state.inventory[id] > 0) {
              state.inventory[id] -= 1;
              state.gold += item.sell;
              saveGame();
              updateHud();
              renderModal();
            }
          };
          modalBody.appendChild(row);
        });
      }
    }

    document.getElementById("closeModalBtn").onclick = closeModal;
    document.getElementById("barnHudBtn").onclick = () => openModal("barn");
    modalBackdrop.onclick = (e) => { if (e.target === modalBackdrop) closeModal(); };

    /* ETKİLEŞİM (HIT TESTING) */
    function getWorldPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
      const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
      return {
        x: ((clientX - rect.left) / rect.width) * W,
        y: ((clientY - rect.top) / rect.height) * H
      };
    }

    function inRect(px, py, r) {
      return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
    }

    function detectTarget(px, py) {
      // Önce izometrik tarlaları kontrol et
      for (let i = fieldCenters.length - 1; i >= 0; i--) {
        const { cx, cy } = fieldCenters[i];
        const dx = Math.abs(px - cx) / (TILE_W / 2);
        const dy = Math.abs(py - cy) / (TILE_H / 2);
        if (dx + dy <= 1) return { type: "field", index: i };
      }
      if (inRect(px, py, ZONES.barn)) return { type: "barn" };
      if (inRect(px, py, ZONES.bakery)) return { type: "bakery" };
      if (inRect(px, py, ZONES.truck)) return { type: "truck" };
      if (inRect(px, py, ZONES.chickenPen)) return { type: "chicken" };
      if (inRect(px, py, ZONES.cowPen)) return { type: "cow" };
      return null;
    }

    function handleWorldClick(e) {
      const { x, y } = getWorldPos(e);
      const hit = detectTarget(x, y);
      if (!hit) return;

      const now = Date.now();

      if (hit.type === "field") {
        const f = state.fields[hit.index];
        const { cx, cy } = fieldCenters[hit.index];

        if (!f.crop) {
          const seed = ITEMS[state.selectedSeed];
          if (state.gold < seed.seedCost) {
            showToast(`Yeterli altının yok! (${seed.seedCost}🪙 gerekli)`);
            return;
          }
          state.gold -= seed.seedCost;
          f.crop = state.selectedSeed;
          f.plantedAt = now;
          f.readyAt = now + seed.growTime * 1000;
          addFloatingText(cx, cy - 10, `-${seed.seedCost}🪙`, "#ffd8a8");
          saveGame();
          updateHud();
        } else if (now >= f.readyAt) {
          const cropId = f.crop;
          state.inventory[cropId] = (state.inventory[cropId] || 0) + 2;
          addXp(3);
          addFloatingText(cx, cy - 14, `+2 ${ITEMS[cropId].emoji}`, "#fff");
          f.crop = null;
          f.readyAt = 0;
          saveGame();
          updateHud();
        } else {
          const left = Math.ceil((f.readyAt - now) / 1000);
          showToast(`${ITEMS[f.crop].name} büyüyor (${left} sn kaldı)`);
        }
        return;
      }

      if (hit.type === "chicken" || hit.type === "cow") {
        const a = state.animals[hit.type];
        const cfg = hit.type === "chicken"
          ? { feed: "wheat", product: "egg", time: 10, xp: 5, x: 170, y: 290 }
          : { feed: "corn",  product: "milk", time: 14, xp: 8, x: 170, y: 445 };

        if (a.state === "hungry") {
          if ((state.inventory[cfg.feed] || 0) < 1) {
            showToast(`Beslemek için 1 ${ITEMS[cfg.feed].emoji} ${ITEMS[cfg.feed].name} lazım!`);
            return;
          }
          state.inventory[cfg.feed] -= 1;
          a.state = "producing";
          a.readyAt = now + cfg.time * 1000;
          addFloatingText(cfg.x, cfg.y, `-1 ${ITEMS[cfg.feed].emoji}`, "#ffd8a8");
          saveGame();
          updateHud();
        } else if (now >= a.readyAt) {
          state.inventory[cfg.product] = (state.inventory[cfg.product] || 0) + 1;
          addXp(cfg.xp);
          addFloatingText(cfg.x, cfg.y, `+1 ${ITEMS[cfg.product].emoji}`, "#fff");
          a.state = "hungry";
          a.readyAt = 0;
          saveGame();
          updateHud();
        } else {
          const left = Math.ceil((a.readyAt - now) / 1000);
          showToast(`Üretim devam ediyor (${left} sn)`);
        }
        return;
      }

      if (hit.type === "barn") openModal("barn");
      if (hit.type === "bakery") openModal("bakery");
      if (hit.type === "truck") openModal("truck");
    }

    canvas.addEventListener("click", handleWorldClick);
    canvas.addEventListener("mousemove", (e) => {
      const { x, y } = getWorldPos(e);

    /* 2D ÇİZİM FONKSİYONLARI */
    function drawRoundRect(x, y, w, h, r, fill, stroke, lw = 2) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
    }

    function drawTree(x, y, scale = 1, t = 0) {
      const sway = Math.sin(t * 2 + x) * 2;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      // Gölge
      ctx.fillStyle = "rgba(0,0,0,0.16)";
      ctx.beginPath();
      ctx.ellipse(0, 12, 20, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      // Gövde
      ctx.fillStyle = "#6e4726";
      ctx.fillRect(-5, -10, 10, 22);
      // Yapraklar
      ctx.fillStyle = "#2f7d32";
      ctx.beginPath(); ctx.arc(sway, -22, 20, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#3f9c42";
      ctx.beginPath(); ctx.arc(-10 + sway, -16, 14, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(11 + sway, -15, 13, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#57b85a";
      ctx.beginPath(); ctx.arc(-4 + sway, -28, 11, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function drawBarn(hovered) {
      const x = 75, y = 100;
      ctx.save();
      if (hovered) { ctx.shadowColor = "#ffe066"; ctx.shadowBlur = 14; }

      // Gölge
      ctx.fillStyle = "rgba(0,0,0,0.2)";
      ctx.beginPath(); ctx.ellipse(x + 68, y + 98, 76, 18, 0, 0, Math.PI * 2); ctx.fill();

      // Silo (sağda)
      drawRoundRect(x + 106, y + 12, 36, 82, 8, "#d8dee9", "#5c6773", 2);
      ctx.fillStyle = "#b0bec5";
      ctx.beginPath(); ctx.arc(x + 124, y + 14, 18, Math.PI, 0); ctx.fill();
      ctx.strokeStyle = "#5c6773"; ctx.stroke();

      // Kırmızı Ambar gövdesi
      drawRoundRect(x + 8, y + 34, 100, 64, 4, "#c92a2a", "#6e1414", 2.5);

      // Çatı
      ctx.beginPath();
      ctx.moveTo(x - 2, y + 38);
      ctx.lineTo(x + 22, y + 8);
      ctx.lineTo(x + 58, y - 4);
      ctx.lineTo(x + 94, y + 8);

      ctx.fillStyle = "#8c1d1d";
      ctx.fill();

      drawRoundRect(x + 36, y + 54, 44, 44, 3, "#a61e1e", "#fff5f5", 3);

      ctx.moveTo(x + 36, y + 54); ctx.lineTo(x + 80, y + 98);
      ctx.moveTo(x + 80, y + 54); ctx.lineTo(x + 36, y + 98);
      ctx.strokeStyle = "#fff5f5"; ctx.lineWidth = 2.5; ctx.stroke();

      // Üst pencere
      drawRoundRect(x + 48, y + 20, 20, 18, 3, "#4a2c11", "#fff5f5", 2);

    function drawFence(x, y, w, h, hovered) {
      ctx.save();
      // Çimen zemini
      drawRoundRect(x, y, w, h, 14, "#76c449", hovered ? "#ffe066" : "#599935", hovered ? 3 : 2);
      // Ahşap çit yatay
      ctx.strokeStyle = "#8c5a2b";
      ctx.lineWidth = 4;
      ctx.strokeRect(x + 4, y + 4, w - 8, h - 8);
      // Direkler
      ctx.fillStyle = "#6e421c";
      for (let px = x + 4; px <= x + w - 4; px += 36) {
        ctx.fillRect(px - 3, y - 2, 6, 12);
        ctx.fillRect(px - 3, y + h - 10, 6, 12);
      }
      ctx.restore();
    }

    function drawChicken(c, t) {
      const bob = Math.abs(Math.sin(t * 7 + c.x)) * 3;
      ctx.save();
      ctx.translate(c.x, c.y - bob);
      ctx.scale(c.dir, 1);
      // Gölge
      ctx.fillStyle = "rgba(0,0,0,0.18)";
      ctx.beginPath(); ctx.ellipse(0, 10 + bob, 11, 4, 0, 0, Math.PI * 2); ctx.fill();
      // Gövde
      ctx.fillStyle = "#fff9db";
      ctx.beginPath(); ctx.ellipse(0, 0, 11, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#d9c598"; ctx.lineWidth = 1.5; ctx.stroke();
      // Kafa
      ctx.beginPath(); ctx.arc(8, -7, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      // İbik & Gaga
      ctx.fillStyle = "#e03131";
      ctx.beginPath(); ctx.arc(7, -13, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#f08c00";
      ctx.beginPath(); ctx.moveTo(13, -7); ctx.lineTo(18, -5); ctx.lineTo(13, -3); ctx.fill();
      // Göz
      ctx.fillStyle = "#212529";
      ctx.beginPath(); ctx.arc(10, -8, 1.3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function drawCow(c, t) {
      const bob = Math.abs(Math.sin(t * 4 + c.x)) * 2;
      ctx.save();
      ctx.translate(c.x, c.y - bob);
      ctx.scale(c.dir, 1);
      // Gölge
      ctx.fillStyle = "rgba(0,0,0,0.2)";
      ctx.beginPath(); ctx.ellipse(0, 16 + bob, 20, 6, 0, 0, Math.PI * 2); ctx.fill();
      // Bacaklar
      ctx.fillStyle = "#343a40";
      ctx.fillRect(-13, 6, 5, 10);
      ctx.fillRect(6, 6, 5, 10);
      // Gövde
      drawRoundRect(-18, -10, 34, 20, 8, "#ffffff", "#495057", 1.8);
      // Benekler
      ctx.fillStyle = "#343a40";
      ctx.beginPath(); ctx.arc(-6, -2, 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(5, 2, 4, 0, Math.PI * 2); ctx.fill();
      // Kafa
      drawRoundRect(12, -14, 14, 14, 5, "#ffffff", "#495057", 1.8);
      drawRoundRect(16, -6, 11, 7, 3, "#ffc9c9", "#c98b8b", 1);
      // Göz
      ctx.fillStyle = "#212529";
      ctx.beginPath(); ctx.arc(19, -9, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function drawIsometricField(index, now, t) {
      const { cx, cy } = fieldCenters[index];
      const hw = TILE_W / 2;
      const hh = TILE_H / 2;
      const f = state.fields[index];
      const isHovered = hoverTarget && hoverTarget.type === "field" && hoverTarget.index === index;
      const isReady = f.crop && now >= f.readyAt;

      ctx.save();
      // 3D toprak kalınlığı
      ctx.beginPath();
      ctx.moveTo(cx - hw, cy);
      ctx.lineTo(cx, cy + hh);
      ctx.lineTo(cx + hw, cy);
      ctx.lineTo(cx + hw, cy + 8);
      ctx.lineTo(cx, cy + hh + 8);
      ctx.lineTo(cx - hw, cy + 8);
      ctx.closePath();
      ctx.fillStyle = "#5c391c";
      ctx.fill();

      // Üst elmas yüzey
      ctx.beginPath();
      ctx.moveTo(cx, cy - hh);
      ctx.lineTo(cx + hw, cy);
      ctx.lineTo(cx, cy + hh);
      ctx.lineTo(cx - hw, cy);
      ctx.closePath();
      ctx.fillStyle = f.crop ? "#8c5a32" : "#9e6b40";
      ctx.fill();
      ctx.strokeStyle = isReady ? "#ffe066" : (isHovered ? "#ffffff" : "#663f20");
      ctx.lineWidth = isReady || isHovered ? 3 : 2;
      ctx.stroke();

      // Sürülmüş toprak çizgileri
      ctx.strokeStyle = "rgba(70, 40, 15, 0.35)";
      ctx.lineWidth = 1.5;
      for (let k = -1; k <= 1; k++) {
        ctx.beginPath();
        ctx.moveTo(cx - 24 + k * 10, cy - 6 + k * 6);
        ctx.lineTo(cx + 12 + k * 10, cy + 12 + k * 6);
        ctx.stroke();
      }

      // Ekin çizimi
      if (f.crop) {
        const total = f.readyAt - f.plantedAt || 1;
        const progress = Math.min(1, Math.max(0, (now - f.plantedAt) / total));
        const sway = Math.sin(t * 3.5 + index) * 3;

        if (isReady) {
          // Hazır ürün (parıltılı)
          ctx.font = "28px serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(ITEMS[f.crop].emoji, cx + sway * 0.5, cy - 10 + Math.sin(t * 5 + index) * 2);
          ctx.font = "12px sans-serif";
          ctx.fillText("✨", cx + 18, cy - 22);
        } else {
          // Büyüyen filiz
          const h = 8 + progress * 16;
          ctx.strokeStyle = "#37b24d";
          ctx.lineWidth = 3;
          [-12, 0, 12].forEach(ox => {
            ctx.beginPath();
            ctx.moveTo(cx + ox, cy + 2);
            ctx.quadraticCurveTo(cx + ox + sway, cy - h / 2, cx + ox + sway, cy - h);
            ctx.stroke();
          });
          // Kalan süre
          const left = Math.ceil((f.readyAt - now) / 1000);
          ctx.font = "bold 11px sans-serif";
          ctx.fillStyle = "#fff8e7";
          ctx.textAlign = "center";
          ctx.fillText(`${left} sn`, cx, cy + 16);
        }
      }
      ctx.restore();
    }

    function drawPond(t) {
      const x = 752, y = 498;
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(x, y, 58, 30, -0.15, 0, Math.PI * 2);
      ctx.fillStyle = "#4dabf7";
      ctx.fill();
      ctx.strokeStyle = "#c9a675";
      ctx.lineWidth = 4;
      ctx.stroke();

      // Su dalgası
      ctx.strokeStyle = "rgba(255,255,255,0.5)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(x + Math.sin(t * 2) * 4, y - 4, 24, 9, 0, 0, Math.PI);
      ctx.stroke();

      // Ördek
      ctx.font = "18px serif";
      ctx.fillText("🦆", x - 12 + Math.sin(t) * 14, y + 2);
      ctx.restore();
    }

    function drawLabel(x, y, text) {
      ctx.save();
      ctx.font = "bold 12px sans-serif";
      const tw = ctx.measureText(text).width + 14;
      drawRoundRect(x - tw / 2, y - 9, tw, 18, 9, "rgba(56, 33, 14, 0.8)", "#e0b363", 1.5);
      ctx.fillStyle = "#fff8e7";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    function drawBubble(x, y, text, bg = "#ffffff") {
      ctx.save();
      ctx.font = "bold 12px sans-serif";
      const tw = ctx.measureText(text).width + 16;
      drawRoundRect(x - tw / 2, y - 13, tw, 24, 12, bg, "#5c3b19", 2);
      ctx.fillStyle = "#3b230d";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, x, y - 1);
      ctx.restore();
    }

    /* ANA OYUN DÖNGÜSÜ */
    let lastTime = performance.now();

    function updateEntities(dt, now) {
      // Bulutlar
      clouds.forEach(c => {
        c.x += c.speed * dt;
        if (c.x > W + 60) c.x = -70;
      });

      // Hayvan hareketleri
      function moveAnimals(list, bounds, speed) {
        list.forEach(a => {
          if (a.wait > 0) {
            a.wait -= dt;
            return;
          }
          const dx = a.tx - a.x;
          const dy = a.ty - a.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 4) {
            a.wait = 1 + Math.random() * 2.5;
            a.tx = bounds.x + 28 + Math.random() * (bounds.w - 56);
            a.ty = bounds.y + 32 + Math.random() * (bounds.h - 56);
          } else {
            a.x += (dx / dist) * speed * dt;
            a.y += (dy / dist) * speed * dt;
            a.dir = dx >= 0 ? 1 : -1;
          }
        });
      }
      moveAnimals(chickens, ZONES.chickenPen, 24);
      moveAnimals(cows, ZONES.cowPen, 16);

      // Fırın dumanı
      if (state.bakery.bakingId && now < state.bakery.readyAt && Math.random() < 0.14) {
        smokeParticles.push({ x: 379, y: 98, r: 5, alpha: 0.75 });
      }
      for (let i = smokeParticles.length - 1; i >= 0; i--) {
        const p = smokeParticles[i];
        p.y -= 26 * dt;
        p.x += Math.sin(p.y * 0.1) * 10 * dt;
        p.r += 7 * dt;
        p.alpha -= 0.45 * dt;
        if (p.alpha <= 0) smokeParticles.splice(i, 1);
      }

      // Kamyon animasyonu
      if (truckAnim.active) {
        if (truckAnim.phase === "leaving") {
          truckAnim.x += 260 * dt;
          if (truckAnim.x > W + 40) {
            truckAnim.phase = "returning";
          }
        } else if (truckAnim.phase === "returning") {
          truckAnim.x -= 220 * dt;
          if (truckAnim.x <= 620) {
            truckAnim.x = 620;
            truckAnim.active = false;
            truckAnim.phase = "idle";
          }
        }
      }

      // Uçan yazılar
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 32 * dt;
        ft.life -= dt;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }
    }

    function render(nowMs) {
      const dt = Math.min(0.05, (nowMs - lastTime) / 1000);
      lastTime = nowMs;
      const t = nowMs / 1000;
      const now = Date.now();

      updateEntities(dt, now);

      // 1. Gökyüzü ve Çimen
      const skyGrad = ctx.createLinearGradient(0, 0, 0, 110);
      skyGrad.addColorStop(0, "#74c0fc");
      skyGrad.addColorStop(1, "#d0ebff");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, 110);

      // Bulutlar
      clouds.forEach(c => {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.scale(c.scale, c.scale);
        ctx.fillStyle = "rgba(255,255,255,0.85)";
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.arc(16, -4, 20, 0, Math.PI * 2);
        ctx.arc(34, 0, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Çayır zemini
      const grassGrad = ctx.createLinearGradient(0, 95, 0, H);
      grassGrad.addColorStop(0, "#82c951");
      grassGrad.addColorStop(1, "#5aa33b");
      ctx.fillStyle = grassGrad;
      ctx.fillRect(0, 95, W, H - 95);

      // Dekoratif ağaçlar (arka plan)
      drawTree(34, 118, 0.9, t);
      drawTree(248, 108, 0.8, t);
      drawTree(456, 104, 0.85, t);
      drawTree(802, 108, 0.95, t);

      // 2. Binalar ve Kamyon
      drawBarn(hoverTarget && hoverTarget.type === "barn");
      drawBakery(hoverTarget && hoverTarget.type === "bakery", now);
      drawTruckAndBoard(hoverTarget && hoverTarget.type === "truck");

      // Duman parçacıkları
      smokeParticles.forEach(p => {
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, p.alpha)})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      });

      // 3. Kümes ve Tavuklar
      drawFence(ZONES.chickenPen.x, ZONES.chickenPen.y, ZONES.chickenPen.w, ZONES.chickenPen.h, hoverTarget && hoverTarget.type === "chicken");
      chickens.forEach(c => drawChicken(c, t));
      drawLabel(170, 386, "Kümes");

      const ch = state.animals.chicken;
      if (ch.state === "hungry") drawBubble(170, 255, "1 🌾 Besle", "#fff8e7");
      else if (now >= ch.readyAt) drawBubble(170, 255, "🥚 Topla!", "#d8f5a2");
      else drawBubble(170, 255, `⏳ ${Math.ceil((ch.readyAt - now) / 1000)} sn`, "#fff3bf");

      // 4. Ahır ve İnekler
      drawFence(ZONES.cowPen.x, ZONES.cowPen.y, ZONES.cowPen.w, ZONES.cowPen.h, hoverTarget && hoverTarget.type === "cow");
      cows.forEach(c => drawCow(c, t));
      drawLabel(170, 541, "Ahır");

      const cw = state.animals.cow;
      if (cw.state === "hungry") drawBubble(170, 410, "1 🌽 Besle", "#fff8e7");
      else if (now >= cw.readyAt) drawBubble(170, 410, "🥛 Topla!", "#d8f5a2");
      else drawBubble(170, 410, `⏳ ${Math.ceil((cw.readyAt - now) / 1000)} sn`, "#fff3bf");

      // 5. İzometrik 9 Tarla
      for (let i = 0; i < 9; i++) {
        drawIsometricField(i, now, t);
      }

      // 6. Gölet ve Ön Ağaçlar
      drawPond(t);
      drawTree(34, 540, 0.9, t);
      drawTree(805, 370, 0.85, t);

      // 7. Uçan Ödül Yazıları
      floatingTexts.forEach(ft => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
        ctx.font = "900 17px sans-serif";
        ctx.textAlign = "center";
        ctx.strokeStyle = "#3b230d";
        ctx.lineWidth = 4;
        ctx.strokeText(ft.text, ft.x, ft.y);
        ctx.fillStyle = ft.color;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      });

      if (currentModal === "bakery" && state.bakery.bakingId) {
        renderModal();
      }

      requestAnimationFrame(render);
    }

    loadGame();
    ensureOrders();
    renderSeedDock();
    updateHud();
    requestAnimationFrame(render);
  </script>
</body>
</html>
